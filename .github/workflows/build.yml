name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          - platform: macos-latest
            target: mac
          - platform: windows-latest
            target: win
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
        with:
          # Installs the ngrok native addon for every architecture packaged
          # on this runner (e.g. Windows x64 and arm64), not just the host's.
          install-args: --frozen-lockfile '--cpu=*'

      # Tags publish installers plus the electron-updater feed (latest*.yml)
      # to a draft GitHub Release; manual runs only upload workflow artifacts.
      - name: Build and package Electron app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing. Without these, builds are unsigned and macOS
          # auto-update is unavailable.
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=always; fi
          bun run desktop:build --${{ matrix.target }} --publish "$publish"

      - uses: actions/upload-artifact@v7
        with:
          name: openweave-${{ matrix.target }}
          path: |
            desktop-electron/release/*.dmg
            desktop-electron/release/*.zip
            desktop-electron/release/*.exe
            desktop-electron/release/*.AppImage
            desktop-electron/release/*.deb
            desktop-electron/release/latest*.yml
          if-no-files-found: error

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - uses: ./.github/actions/setup-bun

      - name: Build packages for publish
        run: |
          publish_packages="packages/scene-graph packages/pen packages/kiwi packages/fig packages/core packages/dom-css packages/cli packages/mcp packages/react"
          for dir in $publish_packages; do
            if [ -f "$dir/package.json" ] && node -p "require('./$dir/package.json').scripts?.build" 2>/dev/null | grep -qv undefined; then
              echo "Building $dir..."
              (cd "$dir" && bun run build)
            fi
          done

      - name: Prepare publish directories
        run: |
          bun tools/release-packages/src/prepare-publish-dirs.ts
          find .publish -maxdepth 3 -type f | sort

      - name: Pack packages for publish
        run: |
          mkdir -p .npm-packages
          pack_if_new() {
            local dir=$1
            local name=$(node -p "require('./$dir/package.json').name")
            local version=$(node -p "require('./$dir/package.json').version")
            local publish_dir=".publish/$(basename "$dir")"
            if npm view "${name}@${version}" version 2>/dev/null; then
              echo "${name}@${version} already published, skipping pack"
            else
              (cd "$publish_dir" && npm pack --pack-destination "$root_dir/.npm-packages")
            fi
          }
          root_dir="$PWD"
          publish_packages="packages/scene-graph packages/pen packages/kiwi packages/fig packages/core packages/dom-css packages/cli packages/mcp packages/react"
          for dir in $publish_packages; do
            pack_if_new "$dir"
          done
          ls -la .npm-packages
          for tarball in .npm-packages/openweave-*.tgz; do
            echo "Contents of $tarball"
            tar -tf "$tarball" | sed -n '1,60p' || true
          done
          bun tools/release-packages/src/validate-tarballs.ts

      - name: Publish packages to npm
        run: |
          publish_if_new() {
            local dir=$1
            local name=$(node -p "require('./$dir/package.json').name")
            local version=$(node -p "require('./$dir/package.json').version")
            if npm view "${name}@${version}" version 2>/dev/null; then
              echo "${name}@${version} already published, skipping"
            else
              local tarball
              tarball=$(cd .npm-packages && ls openweave-$(basename "$dir")-${version}.tgz)
              npm publish "./.npm-packages/${tarball}" --access public --provenance
            fi
          }
          publish_packages="packages/scene-graph packages/pen packages/kiwi packages/fig packages/core packages/dom-css packages/cli packages/mcp packages/react"
          for dir in $publish_packages; do
            publish_if_new "$dir"
          done
