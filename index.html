<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PencilDraw - OpenPencil x tldraw Hybrid Infinite Canvas</title>
  <meta name="description" content="A powerful hybrid infinite canvas combining fast whiteboarding, freehand sketching, smart connectors, and precision UI vector wireframing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="dark-theme">
  <div id="app">
    <!-- Header Navigation -->
    <header id="header-nav"></header>

    <!-- Main Workspace Area -->
    <div id="workspace">
      <!-- Left Sidebar: Layers & Components -->
      <aside id="left-sidebar" class="sidebar collapsed">
        <div class="sidebar-tabs">
          <button class="tab-btn active" data-tab="layers">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            Layers
          </button>
          <button class="tab-btn" data-tab="library">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            UI Stencils
          </button>
        </div>
        <div class="sidebar-content">
          <div id="layers-panel" class="tab-content active"></div>
          <div id="library-panel" class="tab-content"></div>
        </div>
      </aside>

      <!-- Canvas Container -->
      <main id="canvas-container">
        <canvas id="main-canvas"></canvas>
        <div id="canvas-overlay"></div>
      </main>

      <!-- Right Sidebar: Inspector Panel -->
      <aside id="right-sidebar" class="sidebar">
        <div id="inspector-panel"></div>
      </aside>
    </div>

    <!-- Floating Dock Toolbar -->
    <nav id="floating-toolbar"></nav>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden"></div>

    <!-- Toast & Dialog Overlay -->
    <div id="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
